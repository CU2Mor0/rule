# Region groups. Keep the Mihomo select semantics and node-name filters.
🇭🇰 香港节点 = select,policy-regex-filter=(🇭🇰|港|\bHK(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z][A-Za-z]+)?)?\b|hk|Hong Kong|HongKong|hongkong|HONG KONG|HONGKONG|深港|HKG|九龙|Kowloon|新界|沙田|荃湾|葵涌)
🇨🇳 台湾节点 = select,policy-regex-filter=(🇹🇼|🇼🇸|台|新北|彰化|\bTW(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z][A-Za-z]+)?)?\b|Taiwan|TAIWAN|TWN|TPE|ROC)
🇸🇬 狮城节点 = select,policy-regex-filter=(🇸🇬|新加坡|坡|狮城|\bSG(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z][A-Za-z]+)?)?\b|Singapore|SINGAPORE|SIN)
# Mihomo used (?<!尼|-)日. Lookbehind is omitted for safer Shadowrocket compatibility.
🇯🇵 日本节点 = select,policy-regex-filter=(🇯🇵|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|\bJP(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z][A-Za-z]+)?)?\b|Japan|JAPAN|JPN|NRT|HND|KIX|TYO|OSA|关西|Kansai|KANSAI)
🇰🇷 韩国节点 = select,policy-regex-filter=(🇰🇷|\bKR(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z][A-Za-z]+)?)?\b|Korea|KOREA|KOR|首尔|韩|韓|春川|Chuncheon|ICN)
🇺🇸 美国节点 = select,policy-regex-filter=(🇺🇸|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|纽约|纽纽|亚特兰大|迈阿密|华盛顿|\bUS(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z][A-Za-z]+)?)?\b|United States|UnitedStates|UNITED STATES|USA|America|AMERICA|JFK|EWR|IAD|ATL|ORD|MIA|NYC|LAX|SFO|SEA|DFW|SJC)

